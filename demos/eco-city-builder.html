<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174b36">
<title>අනාගත නගරය සැලසුම් කරමු – සතිය 08</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box;background:#edf6e7;color:#183629;font-family:system-ui,"Noto Sans Sinhala",sans-serif}
main{max-width:540px;width:100%;padding:24px;border:1px solid #c9ddc2;border-radius:18px;background:#fff;line-height:1.7;box-shadow:0 10px 34px #18362912}
.muted{font-size:13px;color:#547565}.bar{height:8px;border-radius:99px;background:#e6eee1;overflow:hidden;margin-top:16px}.bar i{display:block;width:35%;height:100%;background:#368a50;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{width:90%}}
</style>
</head>
<body>
<main><h2>🏙️ අනාගත නගරය සැලසුම් කරමු</h2><p class="muted">ඔබේ නගර සැලසුම් Game එක පූරණය වෙමින් පවතී…</p><div class="bar"><i></i></div></main>
<script>
(async()=>{
try{
 const files=Array.from({length:5},(_,i)=>`./eco-city-builder-payload/part-${String(i+1).padStart(2,"0")}.txt`);
 const responses=await Promise.all(files.map(url=>fetch(url)));
 if(responses.some(r=>!r.ok)) throw new Error("Game files could not be loaded");
 const encoded=(await Promise.all(responses.map(r=>r.text()))).join("").trim();
 if(!/^[A-Za-z0-9+/=]+$/.test(encoded)||encoded.length%4!==0) throw new Error("Invalid game data");
 const binary=atob(encoded);
 const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
 const html=await new Response(stream).text();
 if(!html.includes("Eco City Builder")||!html.includes("GAME OVER")) throw new Error("Game data validation failed");
 document.open();document.write(html);document.close();
}catch(error){
 document.body.innerHTML='<main><h2>Game එක පූරණය කළ නොහැකි විය</h2><p>අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කර නවතම Chrome හෝ Edge Browser එකෙන් නැවත උත්සාහ කරන්න.</p></main>';
 console.error(error);
}
})();
</script>
</body></html>
