<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>සයිබර් ආරක්ෂක මෙහෙයුම – සතිය 07</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1628;color:#e7eef8;font-family:system-ui,"Noto Sans Sinhala",sans-serif}
    main{max-width:560px;width:100%;padding:26px;border:1px solid #35516e;border-radius:18px;background:#10243b;line-height:1.7}
    .muted{color:#afc1d7;font-size:14px}
    .bar{height:7px;background:#263e59;border-radius:99px;overflow:hidden;margin-top:18px}
    .bar span{display:block;width:35%;height:100%;background:#38bdf8;animation:load 1.1s ease-in-out infinite alternate}
    @keyframes load{to{width:90%}}
  </style>
</head>
<body>
  <main>
    <h2>සයිබර් ආරක්ෂක මෙහෙයුම සූදානම් වෙමින් පවතී…</h2>
    <p class="muted">පුහුණු පරිසරය පූරණය කරනවා. කරුණාකර මෙම පිටුව වසා නොදමන්න.</p>
    <div class="bar"><span></span></div>
  </main>
  <script>
    (async()=>{
      try{
        const paths=Array.from({length:9},(_,i)=>`./cyber-smart-mission-payload/part-${String(i+1).padStart(2,"0")}.txt`);
        const responses=await Promise.all(paths.map(path=>fetch(path)));
        if(responses.some(response=>!response.ok)) throw new Error("Payload fetch failed");
        const encoded=(await Promise.all(responses.map(response=>response.text()))).join("");
        const binary=atob(encoded);
        const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const html=await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML="<main><h2>Demo එක පූරණය කළ නොහැකි විය</h2><p>අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කර පිටුව නැවත විවෘත කරන්න. තවමත් ගැටලුව පවතී නම් දැනුම් දෙන්න.</p></main>";
        console.error(error);
      }
    })();
  </script>
</body>
</html>
