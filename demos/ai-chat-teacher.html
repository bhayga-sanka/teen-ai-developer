<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b66">
<title>AI ගුරුවරයා – සතිය 11</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#eef4fb;color:#18324b;font-family:system-ui,"Noto Sans Sinhala",sans-serif}
main{max-width:540px;width:100%;padding:25px;border:1px solid #d9e4f0;border-radius:18px;background:#fff;line-height:1.7;box-shadow:0 12px 36px #123b6617}
small{color:#64748b}
.bar{height:8px;background:#e5edf7;border-radius:99px;overflow:hidden;margin-top:16px}
.bar span{display:block;width:35%;height:100%;background:#2563eb;animation:load 1s ease-in-out infinite alternate}
@keyframes load{to{width:90%}}
</style>
</head>
<body>
<main>
<h2>🤖 AI ගුරුවරයා සූදානම් වෙමින් පවතී…</h2>
<small>ඔබේ ඉගෙනුම් සහායකයා පූරණය කරනවා. කරුණාකර මොහොතක් රැඳී සිටින්න.</small>
<div class="bar"><span></span></div>
</main>
<script>
(async()=>{
try{
 const files=Array.from({length:3},(_,i)=>`./ai-chat-teacher-payload/part-${String(i+1).padStart(2,"0")}.txt`);
 const responses=await Promise.all(files.map(url=>fetch(url)));
 if(responses.some(r=>!r.ok)) throw new Error("AI Teacher files could not be loaded");
 const encoded=(await Promise.all(responses.map(r=>r.text()))).join("").trim();
 if(!/^[A-Za-z0-9+/=]+$/.test(encoded)||encoded.length%4!==0) throw new Error("Invalid AI Teacher data");
 const binary=atob(encoded);
 const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
 const html=await new Response(stream).text();
 if(!html.includes("ඔබේම AI ගුරුවරයා")||!html.includes("buildPrompt")) throw new Error("AI Teacher validation failed");
 document.open();document.write(html);document.close();
}catch(error){
 document.body.innerHTML='<main><h2>AI ගුරුවරයා පූරණය කළ නොහැකි විය</h2><p>අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කර නවතම Chrome හෝ Edge Browser එකෙන් නැවත උත්සාහ කරන්න.</p></main>';
 console.error(error);
}
})();
</script>
</body>
</html>
